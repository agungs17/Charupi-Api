[package]
name = "charupi-api"
version = "0.1.0"
edition = "2021"
authors = ["Charupi Team"]
description = "Lightweight modular Axum service for Charupi"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
