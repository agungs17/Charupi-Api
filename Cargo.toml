[package]
name = "charupi-api"
version = "0.1.0"
edition = "2021"
authors = ["Charupi Team"]
description = "High-performance Axum-based intermediary gateway and business logic service for Charupi"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7", features = ["macros", "tokio"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full", "timeout", "limit"] }

# Serialization & Data formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"

# Database & Vectors
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid"
] }

# HTTP Client & Streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment & Configuration
dotenvy = "0.15"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
