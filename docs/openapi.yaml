openapi: 3.0.3
info:
  title: Charupi API Documentation
  description: |
    API documentation for **Charupi-Api**, the backend gateway and business logic service for Charupi.
    Built with Rust, Axum, Tokio, and Tower-HTTP.
  version: 0.1.0
  contact:
    name: Charupi Team
servers:
  - url: http://localhost:3000
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health Check
      description: Returns the health status, service metadata, and active environment.
      operationId: healthCheck
      tags:
        - System & Health
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
              example:
                success: true
                message: "Service is healthy"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Internal server error"
                code: "INTERNAL_ERROR"
components:
  schemas:
    HealthApiResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Service is healthy"

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 52

    ErrorResponse:
      type: object
      required:
        - success
        - message
        - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Resource not found"
        code:
          type: string
          description: Stable uppercase SNAKE_CASE error code
          example: "NOT_FOUND"

    ValidationErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "email"
        message:
          type: string
          example: "Invalid email format"

    ValidationErrorResponse:
      type: object
      required:
        - success
        - message
        - code
        - details
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        code:
          type: string
          example: "VALIDATION_ERROR"
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
