services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: charupi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-charupi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-charupi_password}
      POSTGRES_DB: ${DB_NAME:-charupi_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-charupi} -d ${DB_NAME:-charupi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
