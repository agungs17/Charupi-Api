services:
  charupi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: charupi-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ENVIRONMENT=production
      - RUST_LOG=charupi_api=info,tower_http=info
